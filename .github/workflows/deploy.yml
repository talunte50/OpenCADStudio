name: Build and Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许在 Actions 页面手动点「Run workflow」

# 同一分支只保留最新一次部署，避免并发互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ================= 1. 构建 =================
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rust + wasm32 目标。必须在 CI 上构建：EdgeOne / CF 的托管构建环境没有 Rust。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 必须钉死版本，不能用 'latest'：
      #   latest 会漂移到 trunk v0.22.0-beta.x，该版本已不再接受 `--locked`，
      #   会让 `trunk build --locked` 在第 8 步直接以 exit 2 失败（run #34876044442）。
      #   v0.21.14 是当前最后一个正式版。
      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'v0.21.14'

      # 关键：从 Cargo.lock 读出 wasm-bindgen 的锁定版本，
      # 再装"完全匹配"的 wasm-bindgen CLI。版本不匹配会让构建在最后一步挂掉。
      - name: Read wasm-bindgen version
        id: wasm-bindgen-version
        shell: bash
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          test -n "$VERSION" || { echo "Cargo.lock 里没找到 wasm-bindgen 版本"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "锁定 wasm-bindgen 版本: $VERSION"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}

      # --dist dist     覆盖 Trunk.toml 的 dist = "dist/app"，产物写到 ./dist
      # --public-url /  覆盖 public_url = "/app/"，资源引用改为根路径
      # 注意：这里不再传 --locked（trunk 的 --locked 不稳定），Cargo.lock 仍然生效
      - name: Build with Trunk
        run: |
          set -e
          trunk build --release --dist dist --public-url /
          echo "=== 构建产物（按大小倒序前 20）==="
          find dist -type f -printf '%12s  %p\n' | sort -rn | head -20

      # ================= 2. 压到 25MB 以内 =================
      # 上游产物 OpenCADStudio-<hash>_bg.wasm 约 45.3MiB，
      # 而 EdgeOne Pages（以及 Cloudflare Pages）单文件上限都是 25MB，
      # 45MiB 直接推会失败 —— 这是本站点 500 / 部署失败的最终根因。
      # 解法：brotli 预压缩成 ~12MiB，再把 .br 改名回 .wasm（保持引用路径不变），
      #       最后由 edgeone.json 声明 Content-Encoding: br，浏览器自动解压。
      - name: Brotli-compress wasm
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq brotli
          echo "brotli 版本: $(brotli --version)"

          for f in $(find dist -type f -name '*.wasm'); do
            before=$(stat -c%s "$f")
            brotli -q 11 -f -o "$f.br" "$f"
            after=$(stat -c%s "$f.br")
            mv -f "$f.br" "$f"
            echo "brotli: $f   $before -> $after bytes"
          done

          echo "=== 压缩后（按大小倒序前 20）==="
          find dist -type f -printf '%12s  %p\n' | sort -rn | head -20

      # edgeone.json 必须放在「要上传的目录根部」，CLI 才会读到 headers 规则
      - name: Add EdgeOne headers config
        run: |
          set -e
          cp .github/edgeone.json dist/edgeone.json
          echo "--- dist/edgeone.json ---"
          cat dist/edgeone.json

      # 硬断言：任何一个文件 >= 25MB，部署一定失败，提前在这里挂掉
      - name: Assert no file exceeds 25MB
        run: |
          set -e
          LIMIT=$((25 * 1024 * 1024))
          test -f dist/index.html || { echo "::error::dist/index.html 不存在，构建异常"; exit 1; }
          biggest=$(find dist -type f -printf '%s %p\n' | sort -rn | head -1)
          size=$(echo "$biggest" | cut -d' ' -f1)
          echo "最大文件: $biggest"
          if [ "$size" -ge "$LIMIT" ]; then
            echo "::error::存在 >= 25MB 的文件（EdgeOne Pages 单文件硬上限），压缩没生效。"
            exit 1
          fi
          echo "OK: index.html 存在，且全部文件均低于 25MB"

      # ================= 3. 部署 =================
      - name: Pre-flight check
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::EDGEONE_API_TOKEN 未设置。请到仓库 Settings → Secrets and variables → Actions 添加 secret 'EDGEONE_API_TOKEN'（值来自 EdgeOne Pages 控制台 → API Token）。"
            exit 1
          fi
          echo "EdgeOne Token 已设置，长度: ${#EDGEONE_API_TOKEN}"
          echo "项目名: $PROJECT_NAME"
        env:
          PROJECT_NAME: opencad-studio
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # EdgeOne CLI v1.6+ 的命令是 `edgeone makers deploy`；
      # 旧文档里的 `edgeone pages deploy` 作为回退再试一次。
      - name: Deploy to EdgeOne Pages
        run: |
          set -e
          npm install -g edgeone@1.6.39
          edgeone --version

          echo "---------- edgeone makers deploy --help ----------"
          edgeone makers deploy --help || true
          echo "--------------------------------------------------"

          if edgeone makers deploy ./dist -n "$PROJECT_NAME" -t "$EDGEONE_API_TOKEN" -e production; then
            echo "部署完成（makers deploy）"
          else
            echo "::warning::makers deploy 失败，回退尝试旧命令 pages deploy ..."
            edgeone pages deploy ./dist -n "$PROJECT_NAME" -t "$EDGEONE_API_TOKEN" -e production
            echo "部署完成（pages deploy）"
          fi

          echo "============================================"
          echo "  EdgeOne 部署已提交"
          echo "  项目名: $PROJECT_NAME"
          echo "  自定义域名: https://cad.nxzai.cc.cd"
          echo "============================================"
        env:
          PROJECT_NAME: opencad-studio
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
