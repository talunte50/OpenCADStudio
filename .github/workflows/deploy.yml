name: Build and Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许在 Actions 页面手动点「Run workflow」

# 同一分支只保留最新一次部署，避免并发互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Rust + wasm32 目标
      #    这一步必须在 GitHub 上跑：EdgeOne 自带的构建环境没有 Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 2) 缓存 cargo 依赖与编译产物
      #    首次构建约 20-40 分钟；有缓存后通常几分钟
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 3) 安装 Trunk（预编译二进制，快）
      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'
      #    若上面这个第三方 action 失效，删掉它、取消下面四行注释（源码编译，慢几分钟但稳）：
      # - name: Install Trunk (fallback)
      #   id: trunk-fallback
      #   if: false
      #   run: cargo install trunk --locked

      # 4) 构建静态产物
      #    --dist dist      覆盖 Trunk.toml 的 dist = "dist/app"，产物写到 ./dist
      #    --public-url /  覆盖 public_url = "/app/"，资源引用改为根路径
      #    这两个必须同时给，且要和下面的部署目录 ./dist 匹配
      - name: Build with Trunk
        run: trunk build --release --dist dist --public-url /

      # 5) 部署前自检：确认要上传的目录根部有 index.html
      #    没有它 EdgeOne 首页会直接 404，这一步提前暴露问题
      - name: Verify build output
        run: |
          ls -lh dist/
          test -f dist/index.html || { echo "dist/index.html 不存在，构建异常"; exit 1; }
          echo "大于 20M 的文件（留意体积）："
          find dist -type f -size +20M -exec ls -lh {} \; || true

      # 6) 前置校验：token 缺失/项目名缺失时立刻失败，
      #    避免把"配置错误"拖到 CLI 部署阶段才暴露（CLI 的报错不够直白）
      - name: Pre-flight check
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::EDGEONE_API_TOKEN 未设置。请先到仓库 Settings → Secrets and variables → Actions 添加 secret 'EDGEONE_API_TOKEN'（值从 EdgeOne 控制台 Pages → 项目设置 → API Token 获取）。"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::PROJECT_NAME 未设置。该 workflow 需要它指定要部署到哪个 EdgeOne Pages 项目。"
            exit 1
          fi
          echo "Token 已设置，长度: ${#EDGEONE_API_TOKEN}（前 8 位: ${EDGEONE_API_TOKEN:0:8}...）"
          echo "项目名: $PROJECT_NAME"
        env:
          PROJECT_NAME: opencad-studio
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      # 7) 安装 EdgeOne CLI
      #    官方包名是 'edgeone'。npx 在 runner 上常常拉不下来 / 拉到的版本不匹配，
      #    统一用 npm 全局装，版本可锁定。
      #    install 之后必须 --prefix 到 PATH 已包含的位置（npm -g 默认就在 npm 自己那个前缀下）。
      - name: Install EdgeOne CLI
        run: |
          set -e
          npm install -g edgeone@latest
          # 把 npm 的全局 bin 目录塞进当前 PATH，防止 runner 的 PATH 还没刷新
          export PATH="$(npm config get prefix)/bin:$PATH"
          edgeone --version || { echo "edgeone 安装失败"; exit 1; }

      # 8) 部署到 EdgeOne Pages
      #    使用控制台已建好的项目名（PROJECT_NAME）。CLI 会推送 ./dist 到该项目。
      #    部署完成后 CLI 会打印 production URL（形如 https://xxx.edgeone.app），
      #    从日志里可以直接拿到访问地址。
      - name: Deploy to EdgeOne Pages
        run: |
          set -e
          export PATH="$(npm config get prefix)/bin:$PATH"
          echo "开始部署到 EdgeOne Pages 项目: $PROJECT_NAME"
          edgeone pages deploy ./dist -n "$PROJECT_NAME" -t "$EDGEONE_API_TOKEN"
          echo "部署完成。访问地址（从上方日志的 production URL 行获取）："
        env:
          PROJECT_NAME: opencad-studio
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
