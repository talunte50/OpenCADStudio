name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许在 Actions 页面手动点「Run workflow」

# 同一分支只保留最新一次部署，避免并发互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Rust + wasm32 目标
      #    这一步必须在 GitHub 上跑：CF Pages 自带的构建环境没有 Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 2) 缓存 cargo 依赖与编译产物
      #    首次构建约 20-40 分钟；有缓存后通常几分钟
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 3) 安装 Trunk
      #    上游用 jetli/trunk-action 装预编译二进制；若该第三方 action 失效，
      #    会退回 cargo 源码编译（慢几分钟但稳）。
      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'

      # 4) 关键：从 Cargo.lock 读出 wasm-bindgen 的锁定版本，
      #    再装"完全匹配"的 wasm-bindgen CLI。
      #    trunk build 会用系统里的 wasm-bindgen 处理产物，版本不匹配
      #    （比如 latest 对 0.2.108）会让构建在最后一步挂掉——
      #    这正是上一次 Build with Trunk 失败的根因。
      - name: Read wasm-bindgen version
        id: wasm-bindgen-version
        shell: bash
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          test -n "$VERSION" || { echo "Cargo.lock 里没找到 wasm-bindgen 版本"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "锁定 wasm-bindgen 版本: $VERSION"

      # 5) 装对应版本的 wasm-bindgen CLI（必须和 Cargo.lock 完全一致）
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}

      # 6) 构建静态产物（--locked 强制用 Cargo.lock 锁定版本，防止漂移）
      #    --dist dist      覆盖 Trunk.toml 的 dist = "dist/app"，产物写到 ./dist
      #    --public-url /  覆盖 public_url = "/app/"，资源引用改为根路径
      #    这两个必须同时给，且要和下面的部署目录 ./dist 匹配
      #    CF Pages 不限单文件 25MiB，不需要 wasm-opt 优化，45MiB wasm 直接推。
      - name: Build with Trunk
        run: |
          set -e
          trunk build --locked --release --dist dist --public-url /

      # 7) 部署前自检：确认要上传的目录根部有 index.html
      #    没有它 CF Pages 首页会直接 404，这一步提前暴露问题
      - name: Verify build output
        run: |
          ls -lh dist/
          test -f dist/index.html || { echo "dist/index.html 不存在，构建异常"; exit 1; }
          echo "wasm 文件大小（CF Pages 不限 25MiB，仅记录）："
          find dist -name "*.wasm" -exec ls -lh {} \;

      # 8) 前置校验：CF 凭据缺失时立刻失败，
      #    避免把"配置错误"拖到部署阶段才暴露（API 报错不够直白）
      - name: Pre-flight check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 未设置。请先到仓库 Settings → Secrets and variables → Actions 添加 secret 'CLOUDFLARE_API_TOKEN'（值从 Cloudflare 控制台 My profile → API Tokens 获取，需 Pages:Edit + Account:Read 权限）。"
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CF_ACCOUNT_ID 未设置。请添加 secret 'CF_ACCOUNT_ID'（Cloudflare 控制台右上角 → Manage Account → 账号 ID）。"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::PROJECT_NAME 未设置。该 workflow 需要它指定要部署到哪个 Cloudflare Pages 项目。"
            exit 1
          fi
          echo "Token 已设置，长度: ${#CLOUDFLARE_API_TOKEN}（前 8 位: ${CLOUDFLARE_API_TOKEN:0:8}...）"
          echo "Account: $CF_ACCOUNT_ID"
          echo "项目名: $PROJECT_NAME"
        env:
          PROJECT_NAME: opencad-studio
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 9) 部署到 Cloudflare Pages
      #    通过 CF Pages Direct Upload API（不依赖 Git 仓库绑定，直接推 ./dist 产物）。
      #    1a) 创建/确认项目存在（POST 已存在返回 409 时视为成功）
      #    1b) 拿一个 upload-url（POST deployments 拿到短时效的预签名 URL）
      #    1c) 把 ./dist 打成 zip，PUT 到 upload-url
      #    部署完成后 URL 形如 https://<project>.pages.dev，从 API 响应里取。
      - name: Deploy to Cloudflare Pages
        run: |
          set -e
          BASE="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          CT="Content-Type: application/json"

          # 1) 创建 Pages 项目（已存在时 409，忽略）
          echo "创建/确认 Cloudflare Pages 项目: $PROJECT_NAME"
          create_resp=$(curl -s -X POST "$BASE/accounts/$CF_ACCOUNT_ID/pages/projects" \
            -H "$AUTH" -H "$CT" \
            -d "{\"name\":\"$PROJECT_NAME\",\"production_branch\":\"main\"}" \
            -w "\n%{http_code}")
          create_code=$(echo "$create_resp" | tail -1)
          create_body=$(echo "$create_resp" | head -n -1)
          if [ "$create_code" -eq 409 ]; then
            echo "项目已存在，跳过创建"
          elif [ "$create_code" -ge 200 ] && [ "$create_code" -lt 300 ]; then
            echo "项目创建成功"
          else
            echo "创建项目失败 (HTTP $create_code):"
            echo "$create_body"
            exit 1
          fi

          # 2) 请求 upload-url（CF 给一个短时效的预签名 PUT 地址）
          upload_resp=$(curl -s -X POST "$BASE/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments" \
            -H "$AUTH" -H "$CT" -d "{}" -w "\n%{http_code}")
          upload_code=$(echo "$upload_resp" | tail -1)
          upload_body=$(echo "$upload_resp" | head -n -1)
          if [ "$upload_code" -ne 200 ]; then
            echo "获取 upload-url 失败 (HTTP $upload_code):"
            echo "$upload_body"
            exit 1
          fi
          UPLOAD_URL=$(echo "$upload_body" | python -c "import sys,json; print(json.load(sys.stdin)['result']['upload_url'])")
          UPLOAD_HEADERS=$(echo "$upload_body" | python -c "
import sys, json, shlex
d = json.load(sys.stdin)
for k, v in d['result'].get('upload_headers', {}).items():
    print(f'{k}: {v}')
" | sed 's/^/-H "/; s/$/"/' | tr '\n' ' ')
          DEPLOYMENT_ID=$(echo "$upload_body" | python -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
          echo "Deployment: $DEPLOYMENT_ID"

          # 3) 把 ./dist 打成 zip 并 PUT 到 upload-url
          echo "打包 ./dist → site.zip"
          cd dist
          # 用 Python 的 zipfile 模块（比 curl 的 --data-binary 更稳，自动加 Content-Length）
          python3 - <<'PY'
import zipfile, os
with zipfile.ZipFile('site.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
    for root, dirs, files in os.walk('.'):
        for f in files:
            p = os.path.join(root, f)
            arc = p[2:]  # 去掉开头 ./
            zf.write(p, arcname=arc)
            print('  +', arc, os.path.getsize(p))
print('site.zip 已生成')
PY
          cd -
          zip_size=$(stat -c%s dist/site.zip 2>/dev/null || stat -f%z dist/site.zip)
          echo "site.zip 大小: $zip_size bytes"

          # 4) PUT 到 upload-url（带上 CF 给的 Content-Length 等 headers）
          echo "PUT 到 Cloudflare ..."
          put_resp=$(curl -s -X PUT "$UPLOAD_URL" \
            $(echo "$upload_body" | python -c "
import sys, json, shlex
d = json.load(sys.stdin)
for k, v in d['result'].get('upload_headers', {}).items():
    print(shlex.quote(f'{k}: {v}'))
" 2>/dev/null | xargs -I{} echo -n "-H {} ") \
            -H "Content-Type: application/zip" \
            --data-binary @dist/site.zip \
            -w "\n%{http_code}")
          put_code=$(echo "$put_resp" | tail -1)
          put_body=$(echo "$put_resp" | head -n -1)
          if [ "$put_code" -ge 200 ] && [ "$put_code" -lt 300 ]; then
            echo "上传成功"
          else
            echo "上传失败 (HTTP $put_code):"
            echo "$put_body"
            exit 1
          fi

          # 5) 轮询 deployment 状态
          echo "等待部署完成 ..."
          for i in $(seq 1 30); do
            sleep 10
            dep=$(curl -s "$BASE/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments/$DEPLOYMENT_ID" -H "$AUTH")
            status=$(echo "$dep" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('status',''))")
            url=$(echo "$dep" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('url',''))")
            echo "  [$i/30] status=$status url=$url"
            if [ "$status" = "complete" ]; then
              echo "============================================"
              echo "  部署完成！访问地址:"
              echo "  https://$url"
              echo "  （URL 也可能是 $PROJECT_NAME.pages.dev）"
              echo "============================================"
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo "部署失败，详情:"
              echo "$dep"
              exit 1
            fi
          done
          echo "轮询超时（5 分钟未 complete）"
          exit 1
        env:
          PROJECT_NAME: opencad-studio
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
