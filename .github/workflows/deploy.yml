name: Build and Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许在 Actions 页面手动点「Run workflow」

# 同一分支只保留最新一次部署，避免并发互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Rust + wasm32 目标
      #    这一步必须在 GitHub 上跑：EdgeOne 自带的构建环境没有 Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 2) 缓存 cargo 依赖与编译产物
      #    首次构建约 20-40 分钟；有缓存后通常几分钟
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 3) 安装 Trunk
      #    上游用 jetli/trunk-action 装预编译二进制；若该第三方 action 失效，
      #    会退回 cargo 源码编译（慢几分钟但稳）。
      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'

      # 4) 关键：从 Cargo.lock 读出 wasm-bindgen 的锁定版本，
      #    再装"完全匹配"的 wasm-bindgen CLI。
      #    trunk build 会用系统里的 wasm-bindgen 处理产物，版本不匹配
      #    （比如 latest 对 0.2.108）会让构建在最后一步挂掉——
      #    这正是上一次 Build with Trunk 失败的根因。
      - name: Read wasm-bindgen version
        id: wasm-bindgen-version
        shell: bash
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          test -n "$VERSION" || { echo "Cargo.lock 里没找到 wasm-bindgen 版本"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "锁定 wasm-bindgen 版本: $VERSION"

      # 5) 装对应版本的 wasm-bindgen CLI（必须和 Cargo.lock 完全一致）
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}

      # 6) 构建静态产物（--locked 强制用 Cargo.lock 锁定版本，防止漂移）
      #    --dist dist      覆盖 Trunk.toml 的 dist = "dist/app"，产物写到 ./dist
      #    --public-url /  覆盖 public_url = "/app/"，资源引用改为根路径
      #    这两个必须同时给，且要和下面的部署目录 ./dist 匹配
      #    LTO 已放在 .cargo/config.toml（wasm target 段）里，trunk build 会自动读，
      #    不再需要 RUSTFLAGS 注入（RUSTFLAGS 跟 trunk 内部 embed-bitcode=no 冲突）。
      - name: Build with Trunk
        run: |
          set -e
          trunk build --locked --release --dist dist --public-url /

      # 7) 用 binaryen 的 wasm-opt 二次优化 .wasm 文件
      #    -O3 开 LTO 风格的二次 DCE + inlining + codegen
      #    --sign-ext / --bulk-memory 开现代 wasm 特性，砍重复的 32bit 操作
      #    只对纯 .wasm 文件做，不要喂给 wasm-bindgen 的胶水 JS 文件
      #    通常能再砍 10-20% 体积，叠加 [profile.release] 的极致优化，
      #    45MiB → 预计 18-25MiB（过 EdgeOne Pages 单文件 25MiB 上限）
      - name: Install binaryen (wasm-opt)
        run: |
          set -e
          # 用 GitHub 官方 wasm-opt 预编译二进制，跨平台直接下
          # 锁定一个已知可用的版本；如果失效换 tag（看 https://github.com/WebAssembly/binaryen/releases）
          BIN="wasm-opt"
          curl -fsSL -o "$BIN" "https://github.com/WebAssembly/binaryen/releases/download/version_118/wasm-opt-wasm32"
          chmod +x "$BIN"
          mv "$BIN" "$HOME/.local/bin/wasm-opt" 2>/dev/null || mv "$BIN" "/usr/local/bin/wasm-opt"
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          wasm-opt --version

      - name: Optimize wasm with wasm-opt
        run: |
          set -e
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          echo "=== 优化前 .wasm 文件 ==="
          ls -lh dist/*.wasm
          # -O3 最高优化 + sign-ext + bulk-memory 特性
          # 原地替换 dist 下每个 .wasm
          for f in dist/*.wasm; do
            [ -f "$f" ] || continue
            echo "Optimizing: $f"
            WASM_FILE="$f"
            # wasm-opt 不能原地覆盖，先写临时文件再 mv
            wasm-opt -O3 --sign-ext --bulk-memory \
              -o "${f}.opt" "$f"
            mv "${f}.opt" "$f"
          done
          echo "=== 优化后 .wasm 文件 ==="
          ls -lh dist/*.wasm
          # 自检：任何单文件还超 25MiB 就报错，提前暴露
          if find dist -type f -size +25M | grep -q .; then
            echo "::error::仍有文件超过 25MiB，EdgeOne Pages 会拒收。请进一步缩小产物。"
            find dist -type f -size +25M -exec ls -lh {} \;
            exit 1
          fi
          echo "✓ 所有文件 < 25MiB，EdgeOne Pages 校验可通过"

      # 5) 部署前自检：确认要上传的目录根部有 index.html
      #    没有它 EdgeOne 首页会直接 404，这一步提前暴露问题
      - name: Verify build output
        run: |
          ls -lh dist/
          test -f dist/index.html || { echo "dist/index.html 不存在，构建异常"; exit 1; }
          echo "大于 20M 的文件（留意体积，wasm-opt 后应已 <25MiB）："
          find dist -type f -size +20M -exec ls -lh {} \; || true

      # 6) 前置校验：token 缺失/项目名缺失时立刻失败，
      #    避免把"配置错误"拖到 CLI 部署阶段才暴露（CLI 的报错不够直白）
      - name: Pre-flight check
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::EDGEONE_API_TOKEN 未设置。请先到仓库 Settings → Secrets and variables → Actions 添加 secret 'EDGEONE_API_TOKEN'（值从 EdgeOne 控制台 Pages → 项目设置 → API Token 获取）。"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::PROJECT_NAME 未设置。该 workflow 需要它指定要部署到哪个 EdgeOne Pages 项目。"
            exit 1
          fi
          echo "Token 已设置，长度: ${#EDGEONE_API_TOKEN}（前 8 位: ${EDGEONE_API_TOKEN:0:8}...）"
          echo "项目名: $PROJECT_NAME"
        env:
          PROJECT_NAME: opencad-studio
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      # 7) 安装 EdgeOne CLI
      #    官方包名是 'edgeone'。npx 在 runner 上常常拉不下来 / 拉到的版本不匹配，
      #    统一用 npm 全局装，版本可锁定。
      #    install 之后必须 --prefix 到 PATH 已包含的位置（npm -g 默认就在 npm 自己那个前缀下）。
      - name: Install EdgeOne CLI
        run: |
          set -e
          npm install -g edgeone@latest
          # 把 npm 的全局 bin 目录塞进当前 PATH，防止 runner 的 PATH 还没刷新
          export PATH="$(npm config get prefix)/bin:$PATH"
          edgeone --version || { echo "edgeone 安装失败"; exit 1; }

      # 8) 部署到 EdgeOne Pages
      #    使用控制台已建好的项目名（PROJECT_NAME）。CLI 会推送 ./dist 到该项目。
      #    部署完成后 CLI 会打印 production URL（形如 https://xxx.edgeone.app），
      #    从日志里可以直接拿到访问地址。
      #    --area overseas  指定"全球可用区（不含中国大陆）"加速区域。
      #    （global = 全球 + 中国大陆；overseas = 不含中国大陆）
      - name: Deploy to EdgeOne Pages
        run: |
          set -e
          export PATH="$(npm config get prefix)/bin:$PATH"
          echo "开始部署到 EdgeOne Pages 项目: $PROJECT_NAME (area=overseas)"
          edgeone pages deploy ./dist -n "$PROJECT_NAME" -t "$EDGEONE_API_TOKEN" --area overseas
          echo "部署完成。访问地址（从上方日志的 production URL 行获取）："
        env:
          PROJECT_NAME: opencad-studio
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
