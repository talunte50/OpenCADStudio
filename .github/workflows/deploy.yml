name: Build and Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许在 Actions 页面手动点「Run workflow」

# 同一分支只保留最新一次部署，避免并发互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Rust + wasm32 目标
      #    这一步必须在 GitHub 上跑：EdgeOne 自带的构建环境没有 Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 2) 缓存 cargo 依赖与编译产物
      #    首次构建约 20-40 分钟；有缓存后通常几分钟
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 3) 安装 Trunk（预编译二进制，快）
      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'
      #    若上面这个第三方 action 失效，删掉它、取消下面四行注释（源码编译，慢几分钟但稳）：
      # - name: Install Trunk (fallback)
      #   id: trunk-fallback
      #   if: false
      #   run: cargo install trunk --locked

      # 4) 构建静态产物
      #    --dist dist      覆盖 Trunk.toml 的 dist = "dist/app"，产物写到 ./dist
      #    --public-url /  覆盖 public_url = "/app/"，资源引用改为根路径
      #    这两个必须同时给，且要和下面的部署目录 ./dist 匹配
      - name: Build with Trunk
        run: trunk build --release --dist dist --public-url /

      # 5) 部署前自检：确认要上传的目录根部有 index.html
      #    没有它 EdgeOne 首页会直接 404，这一步提前暴露问题
      - name: Verify build output
        run: |
          ls -lh dist/
          test -f dist/index.html || { echo "dist/index.html 不存在，构建异常"; exit 1; }
          echo "大于 20M 的文件（留意体积）："
          find dist -type f -size +20M -exec ls -lh {} \; || true

      # 6) 部署到 EdgeOne Pages
      #    项目不存在会按 PROJECT_NAME 自动创建
      #    部署后的 URL 会打印在这一步的输出日志里
      - name: Deploy to EdgeOne Pages
        run: npx edgeone pages deploy ./dist -n "$PROJECT_NAME" -t "$EDGEONE_API_TOKEN"
        env:
          PROJECT_NAME: opencad-studio
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
